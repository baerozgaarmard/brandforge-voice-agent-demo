<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#162238"/>
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Wave Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>

  <!-- Radial Glow Behind Right Visual -->
  <circle cx="980" cy="190" r="140" fill="#10b981" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Left Content Block -->
  <g transform="translate(80, 55)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="275" height="28" rx="14" fill="#132e27" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="14" cy="14" r="4" fill="#34d399"/>
    <text x="26" y="18" fill="#34d399" font-size="11" font-weight="600" letter-spacing="1.2" class="mono">BRANDFORGE MEDIA • DEMO</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5" class="sans">
      AI Voice Receptionist
    </text>
    <text x="0" y="122" fill="url(#emeraldGrad)" font-size="34" font-weight="800" letter-spacing="-0.5" class="sans">
      For Local Service Businesses
    </text>

    <!-- Description -->
    <text x="0" y="165" fill="#94a3b8" font-size="15" font-weight="400" class="sans">
      Instant simulated phone reception with zero synthetic robotic lag.
    </text>
    <text x="0" y="190" fill="#94a3b8" font-size="15" font-weight="400" class="sans">
      Dual natural acoustic voices, conversational slot filling, and real-time appointment booking.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 222)">
      <!-- Tag 1: Dental -->
      <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="17" fill="#cbd5e1" font-size="12" font-weight="500" class="sans">🦷 Dental</text>

      <!-- Tag 2: HVAC -->
      <rect x="95" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="107" y="17" fill="#cbd5e1" font-size="12" font-weight="500" class="sans">❄️ HVAC</text>

      <!-- Tag 3: Real Estate -->
      <rect x="185" y="0" width="112" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="197" y="17" fill="#cbd5e1" font-size="12" font-weight="500" class="sans">🏡 Real Estate</text>

      <!-- Tag 4: Salon -->
      <rect x="307" y="0" width="82" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="319" y="17" fill="#cbd5e1" font-size="12" font-weight="500" class="sans">💇 Salon</text>
    </g>
  </g>

  <!-- Right Visual Block: Interactive Call Card Preview -->
  <g transform="translate(730, 48)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="390" height="280" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Top Card Header -->
    <rect x="0" y="0" width="390" height="48" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="40" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="24" r="5" fill="#10b981"/>
    <text x="76" y="28" fill="#94a3b8" font-size="12" font-weight="600" class="mono">LIVE INBOUND CALL • 0:14</text>

    <!-- Voice Waveform Animation Visual -->
    <g transform="translate(26, 68)">
      <rect x="0" y="18" width="4" height="24" rx="2" fill="#10b981"/>
      <rect x="8" y="10" width="4" height="40" rx="2" fill="#10b981"/>
      <rect x="16" y="4" width="4" height="52" rx="2" fill="#34d399"/>
      <rect x="24" y="14" width="4" height="32" rx="2" fill="#34d399"/>
      <rect x="32" y="2" width="4" height="56" rx="2" fill="#06b6d4"/>
      <rect x="40" y="12" width="4" height="36" rx="2" fill="#06b6d4"/>
      <rect x="48" y="20" width="4" height="20" rx="2" fill="#38bdf8"/>
      <rect x="56" y="8" width="4" height="44" rx="2" fill="#34d399"/>
      <rect x="64" y="16" width="4" height="28" rx="2" fill="#10b981"/>
      <rect x="72" y="22" width="4" height="16" rx="2" fill="#10b981"/>

      <text x="92" y="32" fill="#f1f5f9" font-size="13" font-weight="600" class="sans">Alex (AI Receptionist)</text>
      <text x="92" y="48" fill="#64748b" font-size="11" class="mono">38 Human Vocal Clips • 0ms Delay</text>
    </g>

    <!-- Dialogue Bubble -->
    <rect x="24" y="142" width="342" height="46" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="36" y="162" fill="#6ee7b7" font-size="11" font-weight="700" class="mono">AGENT:</text>
    <text x="86" y="162" fill="#e2e8f0" font-size="12" font-weight="400" class="sans">"I can book that teeth cleaning for you.</text>
    <text x="36" y="179" fill="#e2e8f0" font-size="12" font-weight="400" class="sans">May I have your full name, please?"</text>

    <!-- Structured Extraction Badge -->
    <rect x="24" y="202" width="342" height="58" rx="8" fill="#132e27" stroke="#059669" stroke-width="1"/>
    <text x="36" y="222" fill="#34d399" font-size="10" font-weight="700" class="mono">⚡ LIVE APPOINTMENT HUD</text>
    <text x="36" y="244" fill="#f1f5f9" font-size="12" font-weight="500" class="sans">Service: Teeth Cleaning ($99) • Stage: Name</text>
  </g>
</svg>
