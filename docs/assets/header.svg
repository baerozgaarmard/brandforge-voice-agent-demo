<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <!-- Clean, minimalist product header - zero fake UI chrome, zero glowing mesh -->
  <rect width="1200" height="240" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="239" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Left: Minimalist Waveform Logomark -->
  <g transform="translate(70, 75)">
    <!-- Rounded vertical acoustic bars -->
    <rect x="0" y="26" width="5" height="38" rx="2.5" fill="#30363d"/>
    <rect x="12" y="14" width="5" height="62" rx="2.5" fill="#238636"/>
    <rect x="24" y="0" width="5" height="90" rx="2.5" fill="#2ea043"/>
    <rect x="36" y="20" width="5" height="50" rx="2.5" fill="#3fb950"/>
    <rect x="48" y="8" width="5" height="74" rx="2.5" fill="#2ea043"/>
    <rect x="60" y="28" width="5" height="34" rx="2.5" fill="#238636"/>
    <rect x="72" y="36" width="5" height="18" rx="2.5" fill="#30363d"/>
  </g>

  <!-- Typography Content -->
  <g transform="translate(190, 80)">
    <!-- Overline -->
    <text x="0" y="0" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">BRANDFORGE MEDIA</text>

    <!-- Main Title -->
    <text x="0" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.5">AI Voice Receptionist Demo</text>

    <!-- Subtitle -->
    <text x="0" y="68" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Interactive phone receptionist simulation with pre-rendered acoustic voices and live appointment booking.</text>

    <!-- Clean Vertical Tags (Standard dots, no emoji buttons) -->
    <g transform="translate(0, 96)">
      <text x="0" y="0" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500">
        Dental Clinics <tspan fill="#30363d"> · </tspan> HVAC &amp; Home Services <tspan fill="#30363d"> · </tspan> Real Estate <tspan fill="#30363d"> · </tspan> Salons &amp; Med Spas
      </text>
    </g>
  </g>
</svg>
